<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahoot PIN Solutions Finder</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #131b2e;
            --border: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --correct-bg: rgba(34, 197, 94, 0.15);
            --correct-border: #22c55e;
            --correct-text: #4ade80;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container { width: 100%; max-width: 650px; }

        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            text-align: center;
        }

        h2 { margin-top: 0; color: #38bdf8; }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid #2d3748;
            background: var(--bg);
            color: var(--text);
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 2px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent); }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: var(--accent-hover); }
        button:active { transform: scale(0.98); }

        .secondary-btn {
            background: #334155;
            margin-top: 10px;
        }
        .secondary-btn:hover { background: #475569; }

        .question-box {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
            text-align: left;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #f1f5f9;
            line-height: 1.4;
        }

        .choice {
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 10px;
            font-size: 0.95rem;
            background: var(--border);
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
        }

        .choice.correct {
            background: var(--correct-bg);
            color: var(--correct-text);
            border-color: var(--correct-border);
            font-weight: 600;
        }

        .hidden { display: none; }
        #status { color: #ef4444; font-size: 0.9rem; margin-top: 15px; min-height: 20px; }
        
        .spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <!-- Input Screen -->
        <div class="card" id="input-screen">
            <h2>🎯 Kahoot PIN Solutions Finder</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Gib einfach den 6-stelligen Spiel-PIN ein:</p>
            <input type="text" id="game-pin" placeholder="z.B. 123456" maxlength="10" autocomplete="off">
            <button onclick="loadQuizByPin()">Lösungen automatisch finden</button>
            <div id="status"></div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="hidden">
            <div class="card">
                <h2 id="quiz-title">Quiz Titel</h2>
                <p id="quiz-desc" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;"></p>
                <button class="secondary-btn" onclick="resetView()">Anderen PIN eingeben</button>
            </div>
            <div id="questions-container"></div>
        </div>
    </div>

    <script>
        async function loadQuizByPin() {
            const pin = document.getElementById('game-pin').value.trim();
            const statusEl = document.getElementById('status');
            
            if (!pin || pin.length < 4) {
                statusEl.innerText = "Bitte gib einen gültigen Game-PIN ein!";
                return;
            }

            statusEl.innerHTML = '<span class="spinner"></span> Suche Quiz zum PIN...';

            try {
                // 1. Schritt: Kahoot Controller API nach dem PIN fragen
                const kahootControllerUrl = `https://kahoot.it/reserve/session/${pin}`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(kahootControllerUrl)}`;

                const res = await fetch(proxyUrl);
                if (!res.ok) throw new Error("PIN nicht gefunden oder Spiel ist nicht aktiv!");

                const gameInfo = await res.json();
                
                // Manchmal liefert Kahoot direkt die Quiz-ID (UUID) im Payload oder wir müssen über den Titel suchen
                // Da Kahoot die interne Quiz-ID im Live-Controller oft versteckt, nutzen wir alternativ den Quiz-Namen aus dem Spiel
                const quizTitle = gameInfo.name || gameInfo.quizName;
                
                if (!quizTitle) {
                    throw new Error("Konnte den Quiz-Namen zum PIN nicht ermitteln.");
                }

                statusEl.innerHTML = `<span class="spinner"></span> Gefunden: "${quizTitle}". Lade Lösungen...`;

                // 2. Schritt: Über die öffentliche Kahoot-Suche das Quiz anhand des Namens/Titels finden
                const searchUrl = `https://create.kahoot.it/rest/kahoots/?query=${encodeURIComponent(quizTitle)}&limit=1`;
                const searchProxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(searchUrl)}`;
                
                const searchRes = await fetch(searchProxy);
                const searchData = await searchRes.json();

                if (!searchData.entities || searchData.entities.length === 0) {
                    throw new Error(`Quiz "${quizTitle}" öffentlich nicht auffindbar.`);
                }

                // Nimm die UUID des ersten Treffers
                const quizUuid = searchData.entities[0].card.uuid;

                // 3. Schritt: Die echten Fragen und Antworten laden
                const detailsUrl = `https://create.kahoot.it/rest/kahoots/${quizUuid}`;
                const detailsProxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(detailsUrl)}`;
                
                const detailsRes = await fetch(detailsProxy);
                const quizData = await detailsRes.json();

                renderQuiz(quizData);

            } catch (err) {
                statusEl.innerText = "Fehler: " + err.message;
            }
        }

        function renderQuiz(quizData) {
            document.getElementById('input-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            
            document.getElementById('quiz-title').innerText = quizData.title || "Unbenanntes Quiz";
            document.getElementById('quiz-desc').innerText = quizData.description || '';

            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            if (!quizData.questions || quizData.questions.length === 0) {
                container.innerHTML = '<div class="card"><p>Keine Fragen in diesem Quiz gefunden.</p></div>';
                return;
            }

            quizData.questions.forEach((q, index) => {
                let choicesHtml = '';
                
                if (q.choices && q.choices.length > 0) {
                    q.choices.forEach(c => {
                        const isCorrect = c.correct;
                        const correctClass = isCorrect ? 'correct' : '';
                        const icon = isCorrect ? '✅' : '❌';
                        choicesHtml += `
                            <div class="choice ${correctClass}">
                                <span>${c.answer || '(Bild / Formel)'}</span>
                                <span>${icon}</span>
                            </div>
                        `;
                    });
                } else {
                    choicesHtml = '<p style="color: var(--text-muted); font-size: 0.85rem;">Fragetyp ohne Text-Antworten</p>';
                }

                container.innerHTML += `
                    <div class="question-box">
                        <div class="question-title">Frage ${index + 1}: ${q.question || 'Kein Fragetext'}</div>
                        ${choicesHtml}
                    </div>
                `;
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetView() {
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('input-screen').classList.remove('hidden');
            document.getElementById('game-pin').value = '';
            document.getElementById('status').innerText = '';
        }

        document.getElementById('game-pin').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') loadQuizByPin();
        });
    </script>
</body>
</html>
