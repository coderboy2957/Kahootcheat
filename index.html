<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahoot Solutions Hub</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #131b2e;
            --border: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --correct-bg: rgba(34, 197, 94, 0.15);
            --correct-border: #22c55e;
            --correct-text: #4ade80;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container { width: 100%; max-width: 650px; }

        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            text-align: center;
        }

        h2 { margin-top: 0; color: #38bdf8; }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #2d3748;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent); }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 5px;
        }
        button:hover { background: var(--accent-hover); }
        button:active { transform: scale(0.98); }

        .secondary-btn {
            background: #334155;
            margin-top: 15px;
        }
        .secondary-btn:hover { background: #475569; }

        .question-box {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
            text-align: left;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #f1f5f9;
            line-height: 1.4;
        }

        .choice {
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 10px;
            font-size: 0.95rem;
            background: var(--border);
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
        }

        .choice.correct {
            background: var(--correct-bg);
            color: var(--correct-text);
            border-color: var(--correct-border);
            font-weight: 600;
        }

        .hidden { display: none; }
        #status { color: #f87171; font-size: 0.9rem; margin-top: 15px; min-height: 20px; }
        
        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <!-- Input Screen -->
        <div class="card" id="input-screen">
            <h2>🎯 Kahoot Solutions Hub</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px;">Finde blitzschnell alle richtigen Antworten.</p>
            
            <!-- Option 1: Suche per Name/Begriff -->
            <div class="input-group">
                <label>Option 1: Nach Kahoot-Namen / Thema suchen</label>
                <input type="text" id="search-query" placeholder="z.B. Vokabeln Englisch Unit 1" autocomplete="off">
                <button onclick="searchKahoot()">Quiz über Suche finden</button>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

            <!-- Option 2: Direktlink / UUID -->
            <div class="input-group">
                <label>Option 2: Direktlink oder ID einfügen</label>
                <input type="text" id="kahoot-url" placeholder="https://create.kahoot.it/details/..." autocomplete="off">
                <button onclick="loadByUrl()" style="background: #3b82f6;">Direkt laden</button>
            </div>

            <div id="status"></div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="hidden">
            <div class="card">
                <h2 id="quiz-title">Quiz Titel</h2>
                <p id="quiz-desc" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px;"></p>
                <button class="secondary-btn" onclick="resetView()">← Anderes Quiz suchen</button>
            </div>
            <div id="questions-container"></div>
        </div>
    </div>

    <script>
        const proxyUrl = "https://corsproxy.io/?url=";

        async function searchKahoot() {
            const query = document.getElementById('search-query').value.trim();
            const statusEl = document.getElementById('status');

            if (!query) {
                statusEl.innerText = "Bitte gib einen Suchbegriff ein!";
                return;
            }

            statusEl.innerHTML = '<span class="spinner"></span> Suche Quiz...';

            try {
                const searchApi = `https://create.kahoot.it/rest/kahoots/?query=${encodeURIComponent(query)}&limit=1`;
                const res = await fetch(proxyUrl + encodeURIComponent(searchApi));
                
                if (!res.ok) throw new Error("Verbindungsfehler zur Kahoot-Suche.");

                const data = await res.json();
                if (!data.entities || data.entities.length === 0) {
                    throw new Error("Kein passendes Quiz gefunden.");
                }

                const uuid = data.entities[0].card.uuid;
                await loadQuizDetails(uuid);

            } catch (err) {
                statusEl.innerText = "Fehler: " + err.message;
            }
        }

        async function loadByUrl() {
            const inputVal = document.getElementById('kahoot-url').value.trim();
            const statusEl = document.getElementById('status');

            if (!inputVal) {
                statusEl.innerText = "Bitte gib einen Link oder eine ID ein!";
                return;
            }

            statusEl.innerHTML = '<span class="spinner"></span> Lade Quiz...';

            let quizId = inputVal;
            if (inputVal.includes('kahoot.it')) {
                const parts = inputVal.split('/');
                quizId = parts[parts.length - 1];
            }

            await loadQuizDetails(quizId);
        }

        async function loadQuizDetails(uuid) {
            const statusEl = document.getElementById('status');
            try {
                const detailsApi = `https://create.kahoot.it/rest/kahoots/${uuid}`;
                const res = await fetch(proxyUrl + encodeURIComponent(detailsApi));

                if (!res.ok) throw new Error("Quiz nicht gefunden oder privat.");

                const quizData = await res.json();
                renderQuiz(quizData);
            } catch (err) {
                statusEl.innerText = "Fehler: " + err.message;
            }
        }

        function renderQuiz(quizData) {
            document.getElementById('input-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            
            document.getElementById('quiz-title').innerText = quizData.title || "Unbenanntes Quiz";
            document.getElementById('quiz-desc').innerText = quizData.description || '';

            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            if (!quizData.questions || quizData.questions.length === 0) {
                container.innerHTML = '<div class="card"><p>Keine Fragen gefunden.</p></div>';
                return;
            }

            quizData.questions.forEach((q, index) => {
                let choicesHtml = '';
                
                if (q.choices && q.choices.length > 0) {
                    q.choices.forEach(c => {
                        const isCorrect = c.correct;
                        const correctClass = isCorrect ? 'correct' : '';
                        const icon = isCorrect ? '✅' : '❌';
                        choicesHtml += `
                            <div class="choice ${correctClass}">
                                <span>${c.answer || '(Bild / Formel)'}</span>
                                <span>${icon}</span>
                            </div>
                        `;
                    });
                } else {
                    choicesHtml = '<p style="color: var(--text-muted); font-size: 0.85rem;">Keine Text-Antworten</p>';
                }

                container.innerHTML += `
                    <div class="question-box">
                        <div class="question-title">Frage ${index + 1}: ${q.question || 'Kein Fragetext'}</div>
                        ${choicesHtml}
                    </div>
                `;
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetView() {
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('input-screen').classList.remove('hidden');
            document.getElementById('search-query').value = '';
            document.getElementById('kahoot-url').value = '';
            document.getElementById('status').innerText = '';
        }
    </script>
</body>
</html>
